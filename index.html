<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KiwiPath</title>
    <meta name="description" content="Your step-by-step guide from Sri Lanka to New Zealand: pathways, scam checks, budgets in rupees, CV and English practice." />
    <meta name="theme-color" content="#F5F4ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100F06" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KiwiPath" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply a saved Light or Dark choice before the first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem("kiwipath-v1") || "null");
        var theme = saved && saved.state && saved.state.settings && saved.state.settings.theme;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.kpTheme = "1";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
